name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

  integration-tests:
    name: Integration Tests (RustFS) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start RustFS
        run: docker compose up -d --wait

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          S3_ENDPOINT: http://localhost:9000

      - name: Stop RustFS
        if: always()
        run: docker compose down

  build:
    name: Build & Verify Dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure dist/ folder is up-to-date
        run: |
          if [ "$(git diff --ignore-space-at-eol | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

  e2e-save-restore:
    name: E2E Save & Restore - ${{ matrix.os }}
    needs: [unit-tests, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start RustFS
        run: docker compose up -d --wait

      - name: Create test bucket
        shell: bash
        run: |
          curl -sf -X PUT http://localhost:9000/actions-cache \
            -u rustfsadmin:rustfsadmin

      - name: Generate files in working directory
        shell: bash
        run: scripts/create-cache-files.sh ${{ runner.os }} test-cache

      - name: Generate files outside working directory
        shell: bash
        run: scripts/create-cache-files.sh ${{ runner.os }} ~/test-cache

      - name: Save cache
        uses: ./
        with:
          endpoint: localhost
          port: "9000"
          insecure: true
          accessKey: "rustfsadmin"
          secretKey: "rustfsadmin"
          bucket: actions-cache
          use-fallback: false
          key: test-${{ runner.os }}-${{ github.run_id }}
          path: |
            test-cache
            ~/test-cache

      - name: Remove cached files
        shell: bash
        run: |
          rm -rf test-cache
          rm -rf ~/test-cache

      - name: Restore cache
        uses: ./
        with:
          endpoint: localhost
          port: "9000"
          insecure: true
          accessKey: "rustfsadmin"
          secretKey: "rustfsadmin"
          bucket: actions-cache
          use-fallback: false
          key: test-${{ runner.os }}-${{ github.run_id }}
          path: |
            test-cache
            ~/test-cache

      - name: Verify cache files in working directory
        shell: bash
        run: scripts/verify-cache-files.sh ${{ runner.os }} test-cache

      - name: Verify cache files outside working directory
        shell: bash
        run: scripts/verify-cache-files.sh ${{ runner.os }} ~/test-cache

      - name: Stop RustFS
        if: always()
        run: docker compose down

  e2e-restore-keys:
    name: E2E Restore Keys - ${{ matrix.os }}
    needs: [unit-tests, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start RustFS
        run: docker compose up -d --wait

      - name: Create test bucket
        shell: bash
        run: |
          curl -sf -X PUT http://localhost:9000/actions-cache \
            -u rustfsadmin:rustfsadmin

      - name: Generate files in working directory
        shell: bash
        run: scripts/create-cache-files.sh ${{ runner.os }} test-cache

      - name: Generate files outside working directory
        shell: bash
        run: scripts/create-cache-files.sh ${{ runner.os }} ~/test-cache

      - name: Save cache
        uses: ./
        with:
          endpoint: localhost
          port: "9000"
          insecure: true
          accessKey: "rustfsadmin"
          secretKey: "rustfsadmin"
          bucket: actions-cache
          use-fallback: false
          key: test-${{ runner.os }}-${{ github.run_id }}
          path: |
            test-cache
            ~/test-cache

      - name: Remove cached files
        shell: bash
        run: |
          rm -rf test-cache
          rm -rf ~/test-cache

      - name: Restore cache with restore keys
        uses: ./
        with:
          endpoint: localhost
          port: "9000"
          insecure: true
          accessKey: "rustfsadmin"
          secretKey: "rustfsadmin"
          bucket: actions-cache
          use-fallback: false
          key: test-${{ runner.os }}-${{ github.run_id }}-${{ github.sha }}
          path: |
            test-cache
            ~/test-cache
          restore-keys: test-${{ runner.os }}-

      - name: Verify cache files in working directory
        shell: bash
        run: scripts/verify-cache-files.sh ${{ runner.os }} test-cache

      - name: Verify cache files outside working directory
        shell: bash
        run: scripts/verify-cache-files.sh ${{ runner.os }} ~/test-cache

      - name: Stop RustFS
        if: always()
        run: docker compose down

  e2e-save-restore-only:
    name: E2E Save Only & Restore Only - ${{ matrix.os }}
    needs: [unit-tests, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start RustFS
        run: docker compose up -d --wait

      - name: Create test bucket
        shell: bash
        run: |
          curl -sf -X PUT http://localhost:9000/actions-cache \
            -u rustfsadmin:rustfsadmin

      - name: Generate files in working directory
        shell: bash
        run: scripts/create-cache-files.sh ${{ runner.os }} test-cache

      - name: Generate files outside working directory
        shell: bash
        run: scripts/create-cache-files.sh ${{ runner.os }} ~/test-cache

      - name: Save cache (save-only action)
        uses: ./save/
        with:
          endpoint: localhost
          port: "9000"
          insecure: true
          accessKey: "rustfsadmin"
          secretKey: "rustfsadmin"
          bucket: actions-cache
          use-fallback: false
          key: test-save-only-${{ runner.os }}-${{ github.run_id }}
          path: |
            test-cache
            ~/test-cache

      - name: Remove cached files
        shell: bash
        run: |
          rm -rf test-cache
          rm -rf ~/test-cache

      - name: Restore cache (restore-only action)
        uses: ./restore/
        with:
          endpoint: localhost
          port: "9000"
          insecure: true
          accessKey: "rustfsadmin"
          secretKey: "rustfsadmin"
          bucket: actions-cache
          use-fallback: false
          key: test-save-only-${{ runner.os }}-${{ github.run_id }}
          path: |
            test-cache
            ~/test-cache

      - name: Verify cache files in working directory
        shell: bash
        run: scripts/verify-cache-files.sh ${{ runner.os }} test-cache

      - name: Verify cache files outside working directory
        shell: bash
        run: scripts/verify-cache-files.sh ${{ runner.os }} ~/test-cache

      - name: Stop RustFS
        if: always()
        run: docker compose down
