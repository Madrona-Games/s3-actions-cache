name: "s3 cache"
author: tespkg
description: "S3 actions cache with actions/cache passthrough"
inputs:
  endpoint:
    description: "S3-compatible storage endpoint"
    required: false
    default: s3.amazonaws.com
  region:
    description: "AWS region"
    required: false
  port:
    description: "S3-compatible storage port"
    required: false
  insecure:
    description: "Use insecure HTTP connection to the S3-compatible storage endpoint"
    required: false
  accessKey:
    description: "Access key for S3-compatible storage"
    required: true
  secretKey:
    description: "Secret key for S3-compatible storage"
    required: true
  sessionToken:
    description: s3 session token - required when using role
    required: false
  bucket:
    description: "S3-compatible storage bucket"
    required: true
  path:
    description: "A list of files, directories, and wildcard patterns to cache and restore"
    required: true
  key:
    description: "An explicit key for restoring and saving the cache"
    required: true
  use-fallback:
    description: "Use github actions/cache as fallback"
    required: false
    default: "true"
  partSize:
    description: "Part size for multipart uploads in megabytes (default: 64MB)"
    required: false
    default: "64"
  downloadConcurrency:
    description: "Number of parallel byte-range download streams (default: 16). Higher values saturate 10 Gbps+ networks."
    required: false
    default: "8"
  uploadConcurrency:
    description: "Number of parallel upload streams for multipart upload (default: 16). Higher values saturate 10 Gbps+ networks."
    required: false
    default: "8"
runs:
  using: node24
  main: "../dist/saveOnly/index.js"
branding:
  icon: "archive"
  color: "gray-dark"
